<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="html-title">Loading Portfolio...</title>
  
  <!-- Modern Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: "#030605",
            surface: "#070d0a",
            "surface-subtle": "#0b1410",
            border: "rgba(255, 255, 255, 0.06)",
            pine: { accent: "#4d8f7a", light: "#72a997", dark: "#142820", muted: "#2d5246" },
            text: { primary: "#f1f5f9", secondary: "#94a3b8", muted: "#64748b" }
          },
          fontFamily: { sans: ["'Plus Jakarta Sans'", "sans-serif"], mono: ["'JetBrains Mono'", "monospace"] }
        }
      }
    }
  </script>

  <style>
    * { scroll-behavior: smooth; }
    body { background-color: #030605; color: #f1f5f9; -webkit-font-smoothing: antialiased; }
    .glow-card {
      background: rgba(7, 13, 10, 0.78); backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glow-card:hover {
      border-color: rgba(77, 143, 122, 0.32);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.85); transform: translateY(-3px);
    }
  </style>
</head>
<body class="selection:bg-pine-dark selection:text-white">

  <!-- Header Navigation -->
  <header class="fixed top-0 left-0 w-full z-50 bg-void/80 backdrop-blur-xl border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 sm:px-12 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-lg bg-pine-dark/50 border border-pine-muted/40 flex items-center justify-center font-mono font-bold text-pine-light text-sm">
          L
        </div>
        <span class="text-text-primary font-bold text-base tracking-tight" id="header-name">[Your Name]</span>
      </div>
      <nav class="flex items-center gap-6 text-sm font-medium">
        <a href="#about" class="text-text-secondary hover:text-text-primary transition">About</a>
        <a href="#projects" class="px-4 py-2 rounded-lg bg-white/5 border border-white/10 text-text-primary font-mono text-xs hover:text-pine-light transition">
          Contact
        </a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="relative w-full h-screen mx-auto flex items-center">
    <div class="max-w-7xl mx-auto px-6 sm:px-12 flex flex-row items-start gap-6 z-20 w-full">
      <div class="max-w-3xl">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pine-dark/40 border border-pine-muted/30 text-pine-light font-mono text-xs mb-4">
          <span class="w-1.5 h-1.5 rounded-full bg-pine-accent animate-pulse"></span>
          ACTIVE PORTFOLIO
        </div>
        <h1 class="font-extrabold text-text-primary text-4xl sm:text-6xl tracking-tight leading-[1.08] mb-4" id="hero-name">[Your Name]</h1>
        <p class="text-text-secondary text-lg sm:text-xl font-normal leading-relaxed mb-8 max-w-xl" id="hero-title">[Your Specialization]</p>
      </div>
    </div>
  </section>

  <!-- About Section -->
  <section id="about" class="py-28 max-w-7xl mx-auto px-6 sm:px-12 relative z-20">
    <div class="mb-16">
      <p class="text-pine-accent font-mono text-xs uppercase tracking-widest mb-2">[01 // OVERVIEW]</p>
      <h2 class="text-text-primary font-extrabold text-3xl sm:text-5xl tracking-tight">Introduction.</h2>
      <p class="mt-4 text-text-secondary text-base sm:text-lg max-w-3xl leading-relaxed" id="about-text">[Add your personalized about paragraph here.]</p>
    </div>
  </section>

  <!-- Dynamic Content Area -->
  <main id="dynamic-sections-container"></main>

  <!-- Contact Section -->
  <section id="contact" class="py-28 relative flex flex-col items-center justify-center bg-surface border-t border-white/5">
    <div class="max-w-7xl mx-auto px-6 sm:px-12 w-full relative z-20">
      <div class="glow-card rounded-3xl p-8 sm:p-14 max-w-3xl mx-auto">
        <p class="text-pine-accent font-mono text-xs uppercase tracking-widest mb-2">[04 // COMMUNICATION]</p>
        <h2 class="text-text-primary font-black text-3xl sm:text-5xl tracking-tight mb-4">Let's Connect.</h2>
        <div class="flex flex-col gap-4 font-mono text-sm mt-8">
          <a href="#" id="contact-email" class="p-4 rounded-xl bg-void/70 border border-white/10 hover:border-pine-accent text-text-primary flex items-center justify-between transition group">
            <div class="flex items-center gap-3"><span>📧</span><span id="contact-email-text">[Email]</span></div>
            <span class="text-pine-light group-hover:translate-x-1 transition">→</span>
          </a>
          <a href="#" id="contact-github" target="_blank" class="p-4 rounded-xl bg-void/70 border border-white/10 hover:border-pine-accent text-text-primary flex items-center justify-between transition group">
            <div class="flex items-center gap-3"><span>💻</span><span>GitHub</span></div>
            <span class="text-pine-light group-hover:translate-x-1 transition">→</span>
          </a>
          <a href="#" id="contact-linkedin" target="_blank" class="p-4 rounded-xl bg-void/70 border border-white/10 hover:border-pine-accent text-text-primary flex items-center justify-between transition group">
            <div class="flex items-center gap-3"><span>🔗</span><span>LinkedIn</span></div>
            <span class="text-pine-light group-hover:translate-x-1 transition">→</span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <footer class="text-center py-8 text-text-muted text-xs border-t border-white/5 font-mono">
    <span id="footer-year">2026</span> <span id="footer-name">[Your Name]</span> • Portfolio
  </footer>

  <!-- SCRIPT: DYNAMIC DATA LOADER ENGINE -->
  <script>
    async function loadPortfolioData() {
      try {
        const response = await fetch('./data.json');
        const data = await response.json();

        // 1. Set Title and Header
        document.getElementById('html-title').textContent = `${data.profile.name} — Portfolio`;
        document.getElementById('header-name').textContent = data.profile.name;
        document.getElementById('hero-name').textContent = data.profile.name;
        document.getElementById('footer-name').textContent = data.profile.name;

        // 2. Populate Bio and About
        document.getElementById('hero-title').textContent = data.profile.title;
        document.getElementById('about-text').textContent = data.profile.aboutText;

        // 3. Setup Contact Details
        document.getElementById('contact-email').href = `mailto:${data.profile.contact.email}`;
        document.getElementById('contact-email-text').textContent = data.profile.contact.email;
        document.getElementById('contact-github').href = data.profile.contact.github;
        document.getElementById('contact-linkedin').href = data.profile.contact.linkedin;

        // 4. GENERATE DYNAMIC SECTIONS AUTOMATICALLY
        const mainContainer = document.getElementById('dynamic-sections-container');
        data.sections.forEach((section, index) => {
          const secElement = document.createElement('section');
          secElement.className = "py-20 max-w-7xl mx-auto px-6 sm:px-12 relative z-20";
          secElement.id = section.displayTitle.toLowerCase();

          // Section Title
          secElement.innerHTML = `
            <div class="mb-14">
              <p class="text-pine-accent font-mono text-xs uppercase tracking-widest mb-2">[0${index+2} // ${section.displayTitle}]</p>
              <h2 class="text-text-primary font-extrabold text-3xl tracking-tight">${section.displayTitle} Works.</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="grid-${index}"></div>
          `;
          mainContainer.appendChild(secElement);

          // Section Items (Project Cards)
          const gridContainer = document.getElementById(`grid-${index}`);
          section.items.forEach(item => {
            const card = document.createElement('div');
            card.className = "glow-card rounded-2xl p-6 flex flex-col justify-between tilt-card";
            card.setAttribute('data-tilt', '');

            card.innerHTML = `
              <div>
                <div class="w-full h-44 bg-surface-subtle border border-white/5 rounded-xl flex items-center justify-center font-mono text-xs text-text-muted mb-6">
                  <!-- Custom CAD/PDF/SIM Preview placeholder -->
                  [Preview: ${item.fileName}]
                </div>
                <h3 class="text-text-primary font-bold text-xl mb-2">${item.title}</h3>
                <p class="text-text-secondary text-sm leading-relaxed mb-6">${item.description}</p>
              </div>
              <div>
                <div class="flex flex-wrap gap-2 font-mono text-xs text-pine-light mb-4">
                  ${item.tags.map(t => `<span class="px-2.5 py-1 rounded bg-pine-dark/40 border border-pine-muted/30">${t}</span>`).join('')}
                </div>
                <a href="${section.folderPath}${item.fileName}" target="_blank" download class="inline-flex items-center gap-2 text-xs font-mono text-pine-light hover:text-white transition">
                  Download Asset (${item.fileName.split('.').pop()}) →
                </a>
              </div>
            `;
            gridContainer.appendChild(card);
          });
        });

        // 5. Initialize Tilt Effect on dynamic cards
        VanillaTilt.init(document.querySelectorAll(".tilt-card"), {
          max: 14,
          speed: 400,
          glare: true,
          "max-glare": 0.15,
        });

      } catch (err) {
        console.error("Critical Error Loading data.json:", err);
      }
    }

    lucide.createIcons();
    document.addEventListener('DOMContentLoaded', loadPortfolioData);
  </script>
</body>
</html>
